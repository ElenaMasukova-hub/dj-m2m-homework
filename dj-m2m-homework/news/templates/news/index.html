<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новости</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Новости</h1>
    {% for article in articles %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">
                    <a href="{% url 'news-detail' article.id %}">{{ article.title }}</a>
                </h5>
                <p class="card-text">{{ article.text|truncatewords:30 }}</p>
                <p class="text-muted">{{ article.published_at|date:"d.m.Y H:i" }}</p>
            </div>
        </div>
    {% empty %}
        <p>Новостей пока нет.</p>
    {% endfor %}
</div>
</body>
</html>
